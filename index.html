<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인적성 연습 도구</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252a34;background:#263b50;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:16px;min-height:100vh}.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:190px minmax(0,1fr);grid-template-areas:"timer timer" "omr right";gap:14px;max-width:1600px;margin:auto;min-height:calc(100vh - 32px);height:calc(100vh - 32px)}.panel{background:#fff;border:1px solid #d7dfeb;border-radius:21px;box-shadow:0 4px 16px #182a3b22;overflow:hidden}.omr{grid-area:omr;display:flex;flex-direction:column;min-height:0}.omr-head{padding:28px 32px 20px;border-bottom:1px solid #e5e7eb}.omr-head h1{font-size:30px;margin:0 0 18px;color:#15181d}.actions{display:flex;gap:12px}.btn{border:0;border-radius:10px;padding:14px 22px;font:inherit;font-size:17px;cursor:pointer;background:#455267;color:white}.btn.secondary{background:#728198}.btn:hover{filter:brightness(1.08)}.rows{padding:18px;overflow:auto;flex:1;background:#f6f7f8}.answer-row{display:grid;grid-template-columns:1fr repeat(5,54px);align-items:center;gap:10px;background:white;border:1px solid #eceff2;border-radius:12px;padding:12px 14px;margin-bottom:11px;box-shadow:0 2px 5px #0000000c}.qnum{text-align:center;font-size:20px;font-weight:650;position:relative;justify-self:center;min-width:36px;line-height:36px}.qnum.correct::after{content:"";position:absolute;inset:0;border:3px solid #e32636;border-radius:50%;pointer-events:none}.qnum.incorrect::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:3px;background:#e32636;transform:rotate(-12deg);pointer-events:none}.bubble{height:48px;width:48px;border:3px solid #dedfe1;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:15px;transition:.15s}.bubble:hover{border-color:#8492a6}.bubble.selected{background:#34465c;border-color:#34465c;color:white;box-shadow:inset 0 0 0 3px white}.omr-foot{padding:18px 32px;background:#fafafa;border-top:1px solid #e5e7eb;color:#666;font-size:17px}.right{grid-area:right;display:grid;grid-template-rows:minmax(300px,1fr) minmax(320px,1fr);gap:14px;min-height:0}.timer{grid-area:timer;padding:12px 26px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}.timer-top{display:flex;align-items:center;justify-content:center;gap:10px;color:#536176;font-size:16px}.time-input{width:88px;padding:9px 10px;border:1px solid #dbe3ed;border-radius:8px;font:inherit;font-size:18px;text-align:center}.timer-top .colon{font-size:24px;font-weight:700}.help{position:absolute;right:20px;top:9px;width:58px;height:58px;border-radius:50%;border:1px solid #e0e7f0;background:white;color:#df2525;font-weight:bold;font-size:26px;box-shadow:0 3px 12px #0001;cursor:pointer}.clock{font-size:clamp(30px,3.5vw,46px);font-weight:750;letter-spacing:1px;margin:12px 0 14px;font-variant-numeric:tabular-nums}.clock small{font-size:.55em;color:#777;font-weight:600}.timer-controls{display:flex;gap:12px}.start{background:#43b777}.workspace{display:flex;flex-direction:column;min-height:0}.tabs{display:flex;gap:12px;padding:20px 24px;border-bottom:1px solid #e7e8ea}.tab{flex:1;height:62px;border:3px solid #dddfe2;border-radius:9px;background:white;font:inherit;font-size:21px;cursor:pointer}.tab.active{background:#2b3547;border-color:#2b3547;color:white}.workbar{height:72px;border-bottom:1px solid #e9eaec;background:#fafafa;display:flex;align-items:center;justify-content:flex-end;padding:12px 24px;gap:12px}.workbar button{font-size:16px;padding:10px 18px}textarea{resize:none;border:0;outline:0;padding:24px;width:100%;flex:1;font:18px/1.65 inherit;color:#30343b}textarea::placeholder{color:#adb0b2}.draw-wrap{display:none;flex:1;min-height:0;position:relative;padding:12px}canvas{width:100%;height:100%;display:block;border:1px solid #eef0f2;border-radius:8px;touch-action:none;background:white}.draw-tools{position:absolute;top:16px;right:18px;display:flex;gap:8px;align-items:center;background:#fff;padding:6px;border-radius:8px;box-shadow:0 1px 5px #0002}.draw-tools input{width:36px;height:30px;border:0;padding:0}.draw-tools button{border:1px solid #dce2eb;background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer}.calc{padding:24px 28px;display:flex;flex-direction:column}.calc h2{margin:4px 0 14px;color:#59667a;font-size:20px;font-weight:600}.display{height:100px;background:#f7f9fb;border:1px solid #dce5ef;border-radius:10px;margin-bottom:12px;display:flex;align-items:center;justify-content:flex-end;padding:16px 20px;font-size:34px;overflow:hidden;font-variant-numeric:tabular-nums}.keys{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(54px,1fr);gap:8px;flex:1}.keys button{border:1px solid #dfe7f0;background:white;border-radius:9px;color:#536176;font:inherit;font-size:22px;cursor:pointer}.keys button:hover{background:#f2f5f8}.calc.keyboard-active{border-color:#6e829c;box-shadow:0 0 0 3px #71839a35,0 4px 16px #182a3b22}.keys .zero{grid-column:span 2}.hidden{display:none!important}
@media(max-width:760px){body{padding:6px}.app{grid-template-columns:minmax(275px,1fr) minmax(275px,1fr);grid-template-rows:165px minmax(650px,calc(100vh - 183px));gap:8px;height:auto;min-height:calc(100vh - 12px);overflow-x:auto}.answer-row{grid-template-columns:minmax(28px,1fr) repeat(5,38px);gap:5px;padding:8px 6px}.bubble{width:36px;height:36px}.omr-head{padding:14px}.omr-head h1{font-size:22px}.actions .btn{padding:10px;font-size:14px}.rows{padding:10px}.omr-foot{padding:12px;font-size:14px}.right{grid-template-rows:minmax(300px,1fr) minmax(300px,1fr);gap:8px}.tabs{padding:12px}.workbar{height:56px}.calc{padding:16px}.timer{padding:10px}.help{width:42px;height:42px;right:10px;top:8px}.clock{font-size:28px;margin:8px}.timer-controls{gap:6px}.timer-controls .btn{padding:9px 12px;font-size:14px}}
</style></head>
<body><main class="app">
<section class="panel timer"><div class="timer-top"><label for="minutes">시간</label><input class="time-input" id="minutes" type="number" min="0" max="999" value="100" aria-label="분"><span>분</span><span class="colon">:</span><input class="time-input" id="seconds" type="number" min="0" max="59" value="0" aria-label="초"><span>초</span><button class="btn secondary" id="setTime" style="padding:9px 14px">설정</button></div><button class="help" title="사용법" onclick="alert('OMR에서 답을 선택하고, 메모장이나 그림판으로 풀이를 기록하세요. 타이머는 입력한 시간으로 측정하고, 스톱워치는 경과 시간을 측정합니다.')">?</button><div class="clock" id="clock">100분 00초 <small>/ 타이머</small></div><div class="timer-controls"><button class="btn start" id="timerStart">시작</button><button class="btn secondary" id="timerReset">초기화</button><button class="btn secondary" id="watchToggle">스톱워치</button></div></section>
<section class="panel omr"><header class="omr-head"><h1>OMR 답안지</h1><div class="actions"><button class="btn" id="clearAnswers">채점하기</button><button class="btn secondary" id="resetAnswers">답안 초기화</button></div></header><div class="rows" id="rows"></div><footer class="omr-foot" id="score">표시한 답안: 0 / 100</footer></section>
<div class="right"><section class="panel workspace"><div class="tabs"><button class="tab active" data-view="note">메모장</button><button class="tab" data-view="draw">그림판</button></div><div class="workbar" id="noteBar"><button class="btn secondary" id="clearNote">메모 지우기</button></div><textarea id="note" placeholder="메모를 입력하세요..."></textarea><div class="draw-wrap" id="drawWrap"><div class="draw-tools"><input type="color" id="penColor" value="#263b50" title="펜 색상"><input type="range" id="penSize" min="1" max="18" value="4" title="펜 굵기"><button id="erase">지우기</button><button id="clearCanvas">전체 지우기</button></div><canvas id="canvas"></canvas></div></section>
<section class="panel calc"><h2>계산기</h2><div class="display" id="display">0</div><div class="keys" id="keys"></div></section></div></main>
<script>
const rows=document.querySelector('#rows');for(let q=1;q<=100;q++){const row=document.createElement('div');row.className='answer-row';row.innerHTML=`<span class="qnum">${q}</span>`+[1,2,3,4,5].map(n=>`<button class="bubble" aria-label="${q}번 ${n}번 선택" data-q="${q}" data-a="${n}">${n}</button>`).join('');rows.append(row)}
let answers={};document.querySelectorAll('.bubble').forEach(b=>b.onclick=()=>{const q=b.dataset.q,a=b.dataset.a;if(answers[q]===a){delete answers[q];b.classList.remove('selected')}else{document.querySelectorAll(`.bubble[data-q="${q}"]`).forEach(x=>x.classList.remove('selected'));answers[q]=a;b.classList.add('selected')}updateScore()});function updateScore(){document.querySelector('#score').textContent=`표시한 답안: ${Object.keys(answers).length} / 100`}function clearMarks(){document.querySelectorAll('.qnum.correct,.qnum.incorrect').forEach(x=>x.classList.remove('correct','incorrect'))}document.querySelector('#resetAnswers').onclick=()=>{answers={};document.querySelectorAll('.bubble.selected').forEach(x=>x.classList.remove('selected'));clearMarks();updateScore()};document.querySelector('#clearAnswers').onclick=()=>{const key=prompt('정답을 1~5 숫자로 입력하세요. 입력한 숫자 개수까지만 채점합니다 (최대 100개). 쉼표나 공백으로 구분할 수 있습니다.');if(key===null)return;const correct=key.trim().split(/[\s,]+/).filter(Boolean);if(!correct.length||correct.some(x=>! /^[1-5]$/.test(x))){alert('정답을 1~5 숫자로 입력해 주세요.');return}if(correct.length>100){alert('정답은 최대 100개까지 입력할 수 있습니다.');return}clearMarks();let hits=0,answered=0;for(let i=1;i<=correct.length;i++){const number=document.querySelector(`.answer-row:nth-child(${i}) .qnum`);if(answers[i]===correct[i-1]){hits++;number.classList.add('correct')}else{number.classList.add('incorrect')}if(answers[i])answered++}alert(`채점 결과: ${hits} / ${correct.length}\n응답 ${answered}개 중 ${hits}개 정답`)};
const minutesInput=document.querySelector('#minutes'),secondsInput=document.querySelector('#seconds'),clock=document.querySelector('#clock');let remaining=6000, interval=null,watch=false,elapsed=0;function fmt(sec){return `${String(Math.floor(sec/60)).padStart(2,'0')}분 ${String(sec%60).padStart(2,'0')}초`}function selectedDuration(){return Math.max(0,(parseInt(minutesInput.value,10)||0)*60+(parseInt(secondsInput.value,10)||0))}function renderClock(){clock.innerHTML=watch?`${fmt(elapsed)} <small>/ 스톱워치</small>`:`${fmt(remaining)} <small>/ 타이머</small>`}document.querySelector('#setTime').onclick=()=>{if(interval){clearInterval(interval);interval=null}secondsInput.value=Math.min(59,Math.max(0,parseInt(secondsInput.value,10)||0));minutesInput.value=Math.max(0,parseInt(minutesInput.value,10)||0);remaining=selectedDuration();document.querySelector('#timerStart').textContent='시작';renderClock()};document.querySelector('#timerStart').onclick=()=>{if(interval){clearInterval(interval);interval=null;document.querySelector('#timerStart').textContent='계속';return}document.querySelector('#timerStart').textContent='일시정지';interval=setInterval(()=>{if(watch)elapsed++;else if(remaining>0)remaining--;else{clearInterval(interval);interval=null;document.querySelector('#timerStart').textContent='시작';alert('시간이 종료되었습니다.')}renderClock()},1000)};document.querySelector('#timerReset').onclick=()=>{clearInterval(interval);interval=null;elapsed=0;remaining=selectedDuration();document.querySelector('#timerStart').textContent='시작';renderClock()};document.querySelector('#watchToggle').onclick=e=>{watch=!watch;clearInterval(interval);interval=null;remaining=selectedDuration();elapsed=0;document.querySelector('#timerStart').textContent='시작';e.target.textContent=watch?'타이머':'스톱워치';renderClock()};renderClock();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));const draw=b.dataset.view==='draw';document.querySelector('#note').style.display=draw?'none':'block';document.querySelector('#noteBar').style.display=draw?'none':'flex';document.querySelector('#drawWrap').style.display=draw?'block':'none';if(draw)resizeCanvas()});document.querySelector('#clearNote').onclick=()=>document.querySelector('#note').value='';
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');function resizeCanvas(){const old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);const r=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.scale(dpr,dpr);if(old.width)ctx.drawImage(old,0,0,old.width/dpr,old.height/dpr,0,0,r.width,r.height)}let drawing=false,erase=false;canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)};canvas.onpointermove=e=>{if(!drawing)return;ctx.strokeStyle=erase?'#fff':document.querySelector('#penColor').value;ctx.lineWidth=+document.querySelector('#penSize').value;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()};canvas.onpointerup=()=>drawing=false;document.querySelector('#erase').onclick=e=>{erase=!erase;e.target.textContent=erase?'펜으로 그리기':'지우기'};document.querySelector('#clearCanvas').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);window.addEventListener('resize',()=>{if(document.querySelector('#drawWrap').style.display==='block')resizeCanvas()});
const keys=['(',')','%','←','AC','+/-','÷','×','7','8','9','-','4','5','6','+','1','2','3','=','0','.'];let expr='';const display=document.querySelector('#display'),keybox=document.querySelector('#keys');keys.forEach(k=>{const b=document.createElement('button');b.textContent=k;if(k==='0')b.className='zero';b.onclick=()=>press(k);keybox.append(b)});function press(k){if(k==='←'){expr=expr.slice(0,-1)}else if(k==='AC'){expr=''}else if(k==='+/-'){expr=expr?`-(${expr})`:''}else if(k==='%'){expr+='%' }else if(k==='='){try{let safe=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/%/g,'/100');if(!/^[\d+\-*/().\s]+$/.test(safe))throw 0;const val=Function('"use strict";return ('+safe+')')();expr=Number.isFinite(val)?String(+val.toPrecision(12)):'오류'}catch{expr='오류'}}else{if(expr==='오류')expr='';expr+=k}display.textContent=expr||'0'}let calculatorActive=false;const calculator=document.querySelector('.calc');document.addEventListener('pointerdown',e=>{calculatorActive=calculator.contains(e.target);calculator.classList.toggle('keyboard-active',calculatorActive)});document.addEventListener('keydown',e=>{if(!calculatorActive||e.target.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;if(/^[0-9().%+\-*/]$/.test(e.key)){e.preventDefault();press(e.key==='*'?'×':e.key==='/'?'÷':e.key)}else if(e.key==='Enter'){e.preventDefault();press('=')}else if(e.key==='Backspace'){e.preventDefault();press('←')}});
</script></body></html>
